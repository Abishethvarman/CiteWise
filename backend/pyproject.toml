[project]
name = "citewise"
version = "0.1.0"
description = "Privacy-first legal document research and citation verification"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CiteWise contributors" }]
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "pymupdf==1.28.2",
  "rank-bm25==0.2.2",
  "faiss-cpu==1.15.1",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "numpy==2.5.4",
]

[project.optional-dependencies]
semantic = ["sentence-transformers==6.1.0"]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[project.scripts]
citewise = "app.cli:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: optional tests that call a running Ollama server",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001"]
